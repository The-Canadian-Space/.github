name: Append entry to CHANGELOG (reusable)

# Reusable workflow. Called by per-repo on-issue-close workflows to append
# a Keep-a-Changelog "Unreleased" entry when an issue is closed as completed.
#
# 2026-08-18 rewrite: PR-based flow (previously direct-push).
#   Old flow pushed directly to main. Broken on any repo with PR-required
#   branch protection — the bot's push was rejected. 3 TCS repos were
#   silently missing CHANGELOG entries (tcs-tools, tcs-images, tcs-scripts).
#   New flow: create bot branch → open PR → enable auto-merge. Works on
#   every repo, with or without branch protection, and produces a clean
#   audit trail (every CHANGELOG update = one PR on record).
#
# Caller must:
#   - grant `permissions: contents: write, pull-requests: write`
#     (contents:write for branch + push, pull-requests:write for PR + auto-merge)
#   - use `secrets: inherit` so TCS_PROJECT_TOKEN is available (optional —
#     falls back to GITHUB_TOKEN for repos without the org secret)
#   - pass the closed issue's number, title, closer, and state_reason
#
# Caller repo one-time config (required):
#   - Settings → General → Pull Requests → "Allow auto-merge" = ON
#     Without this, the PR is opened but sits unmerged until manually merged.
#     A migration script (see tcs-docs#26) sets this across all TCS repos.
#
# Security note: issue title is USER-CONTROLLED on public repos. It is passed
# to Python via environment variable (never interpolated into the script body)
# and never eval'd or executed as shell.

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      issue_title:
        required: true
        type: string
      closed_by:
        required: true
        type: string
      state_reason:
        required: false
        type: string
        default: completed

jobs:
  append:
    runs-on: ubuntu-latest
    # Only append when the issue was closed as "completed" (not "not planned")
    if: inputs.state_reason == 'completed'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out caller repo
        uses: actions/checkout@v4
        with:
          # Prefer TCS_PROJECT_TOKEN when the caller has it. Fall back to the
          # caller's default GITHUB_TOKEN for repos without the org secret.
          token: ${{ secrets.TCS_PROJECT_TOKEN || github.token }}
          fetch-depth: 0

      - name: Branch, append, PR, auto-merge (with direct-push fallback)
        env:
          GH_TOKEN: ${{ secrets.TCS_PROJECT_TOKEN || github.token }}
          ISSUE_NUM: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ inputs.issue_title }}
          CLOSER: ${{ inputs.closed_by }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # -----------------------------------------------------------------
          # 0. Detect caller capability. If caller granted pull-requests:write,
          #    use PR flow. If not, fall back to direct-push (pre-rewrite
          #    behaviour — works on repos without branch protection).
          # -----------------------------------------------------------------
          # We probe by trying to list PRs on the caller repo — a no-op that
          # requires pull-requests:read at minimum. If it succeeds, we assume
          # write is also granted (they come in the same permission block).
          if gh pr list --limit 1 >/dev/null 2>&1; then
            USE_PR_FLOW=1
            echo "Caller has pull-requests permission — using PR flow"
          else
            USE_PR_FLOW=0
            echo "::notice::Caller lacks pull-requests permission — falling back to direct-push (branch-protected repos will fail; add pull-requests: write to caller permissions block to enable PR flow)"
          fi

          # -----------------------------------------------------------------
          # 1. Write the append script (Python — same logic as pre-rewrite,
          #    idempotent so a retry against a rebased branch doesn't dupe).
          # -----------------------------------------------------------------
          cat > "$RUNNER_TEMP/append_changelog.py" <<'PY'
          import os, pathlib, re
          from datetime import datetime, timezone

          issue_num = os.environ["ISSUE_NUM"]
          title  = os.environ["ISSUE_TITLE"]
          closer = os.environ["CLOSER"]
          repo   = os.environ["REPO"]

          date = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          issue_url = f"https://github.com/{repo}/issues/{issue_num}"
          # Minimal markdown escape for the title (leave the rest as-is)
          safe = title.replace("[", "\\[").replace("]", "\\]")
          entry = f"- {safe} ([#{issue_num}]({issue_url})) — closed {date} by @{closer}\n"

          p = pathlib.Path("CHANGELOG.md")
          if not p.exists():
              p.write_text(
                  "# Changelog\n\n"
                  "All notable changes to this project are documented here.\n"
                  "Format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).\n\n"
                  "## [Unreleased]\n\n",
                  encoding="utf-8",
              )

          txt = p.read_text(encoding="utf-8")

          # Idempotent: don't double-add on a re-run whose entry already landed.
          if entry.strip() in txt:
              print(f"Entry for #{issue_num} already present — nothing to do")
              raise SystemExit(0)

          # Ensure an [Unreleased] section exists. Insert just before the first
          # release section so it lands after any intro paragraph.
          if "## [Unreleased]" not in txt:
              m = re.search(r"^## \[", txt, flags=re.M)
              if m:
                  txt = txt[:m.start()] + "## [Unreleased]\n\n" + txt[m.start():]
              else:
                  if not txt.endswith("\n"):
                      txt += "\n"
                  txt += "\n## [Unreleased]\n\n"

          # Insert the entry under the [Unreleased] header (newest first).
          lines = txt.splitlines(keepends=True)
          for i, line in enumerate(lines):
              if line.startswith("## [Unreleased]"):
                  j = i + 1
                  if j < len(lines) and lines[j].strip() == "":
                      j += 1                        # keep the blank after the header
                  else:
                      lines.insert(j, "\n"); j += 1
                  if j < len(lines) and lines[j].lstrip().startswith("- "):
                      lines.insert(j, entry)        # existing entries: tight list
                  else:
                      lines.insert(j, entry)        # empty section: entry + blank
                      lines.insert(j + 1, "\n")
                  break
          else:
              raise SystemExit("Could not locate [Unreleased] header after bootstrap")

          p.write_text("".join(lines), encoding="utf-8")
          print(f"Appended entry for issue #{issue_num}")
          PY

          # -----------------------------------------------------------------
          # 2. Set up git identity + resolve the caller's default branch.
          # -----------------------------------------------------------------
          git config user.name "tcs-bot"
          git config user.email "actions@github.com"

          base_branch=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)

          if [ "$USE_PR_FLOW" = "1" ]; then
            # -------------------------------------------------------------
            # PR FLOW — caller has pull-requests:write permission.
            # Create bot branch → commit → PR → auto-merge.
            # -------------------------------------------------------------
            bot_branch="bot/changelog-issue-${ISSUE_NUM}-${RUN_ID}"
            git checkout -b "$bot_branch"
            python3 "$RUNNER_TEMP/append_changelog.py"

            if [[ -z "$(git status --porcelain CHANGELOG.md)" ]]; then
              echo "CHANGELOG.md unchanged — nothing to commit"
              exit 0
            fi

            git add CHANGELOG.md
            git commit -q -m "chore(changelog): entry for closed issue #${ISSUE_NUM}"
            git push origin "$bot_branch"

            pr_url=$(gh pr create \
              --base "$base_branch" \
              --head "$bot_branch" \
              --title "chore(changelog): entry for #${ISSUE_NUM}" \
              --body "Auto-generated by \`append-changelog.yml\` when issue [#${ISSUE_NUM}](https://github.com/${REPO}/issues/${ISSUE_NUM}) closed as completed.

          Adds one entry to \`CHANGELOG.md\` under \`[Unreleased]\`. Merges automatically as soon as any required status checks pass.")

            echo "PR: $pr_url"

            if gh pr merge --auto --squash --delete-branch "$pr_url" 2>/dev/null; then
              echo "Auto-merge enabled on PR $pr_url"
              exit 0
            fi

            echo "::warning::Auto-merge could not be enabled. Trying immediate squash-merge."
            if gh pr merge --squash --delete-branch "$pr_url" 2>/dev/null; then
              echo "Squash-merged PR $pr_url immediately"
              exit 0
            fi

            echo "::warning::Could not merge PR $pr_url automatically. Left open for manual review."
            echo "::warning::Most likely cause: repo needs 'Allow auto-merge' enabled in Settings → General → Pull Requests."
            echo "::warning::OR: branch protection requires PR review approvals (needs a human approval)."
            exit 0
          fi

          # -----------------------------------------------------------------
          # DIRECT-PUSH FALLBACK — caller lacks pull-requests:write.
          # Same as pre-rewrite behaviour. Works fine on repos without
          # branch protection. Fails on protected repos (which is why the
          # PR flow was added in the first place).
          # -----------------------------------------------------------------
          # Append + push, retrying on concurrent update.
          for attempt in 1 2 3 4 5; do
            python3 "$RUNNER_TEMP/append_changelog.py"

            if [[ -z "$(git status --porcelain CHANGELOG.md)" ]]; then
              echo "CHANGELOG.md unchanged — nothing to commit"
              exit 0
            fi

            git add CHANGELOG.md
            git commit -q -m "CHANGELOG: entry for closed issue #${ISSUE_NUM}"

            if git push; then
              echo "Direct-pushed on attempt ${attempt}"
              exit 0
            fi

            echo "Push attempt ${attempt} rejected — re-syncing and retrying..."
            git fetch -q origin "$base_branch"
            git reset -q --hard "origin/${base_branch}"
            sleep $(( attempt * 2 ))
          done

          echo "::error::Could not push CHANGELOG update after 5 attempts (direct-push fallback)"
          echo "::error::If this repo has branch protection, add \`pull-requests: write\` to the caller's permissions block to enable PR flow"
          exit 1
